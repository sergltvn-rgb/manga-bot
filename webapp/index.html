<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Чат с Алей</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #222222);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #ff6b81);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg-color: rgba(255, 255, 255, 0.9);
            --alya-msg-bg: #f9ecee;
            --alya-msg-text: #333333;
            --user-msg-bg: linear-gradient(135deg, #ff7e5f, #feb47b);
            --user-msg-text: #ffffff;
            --app-bg: url('https://i.pinimg.com/736x/8b/44/1a/8b441a7da931f825d1979ad2a4d9ab96.jpg') center/cover no-repeat;
        }
        body { font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: var(--app-bg); }
        .header { display: flex; align-items: center; padding: 12px; background: var(--secondary-bg-color); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0,0,0,0.05); z-index: 10; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; margin-right: 12px; border: 2px solid #ff6b81; }
        .header-info h1 { margin: 0; font-size: 16px; }
        .header-info p { margin: 0; font-size: 12px; color: #2ecc71; }
        .header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
        .chat-container { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; z-index: 1; }
        .message { max-width: 80%; padding: 10px 14px; border-radius: 18px; font-size: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .message.bot { align-self: flex-start; background: var(--alya-msg-bg); color: var(--alya-msg-text); border-bottom-left-radius: 4px; }
        .message.user { align-self: flex-end; background: var(--user-msg-bg); color: var(--user-msg-text); border-bottom-right-radius: 4px; }
        .input-area { display: flex; padding: 10px; background: var(--secondary-bg-color); gap: 10px; z-index: 10; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
        input { flex: 1; padding: 10px 15px; border-radius: 20px; border: 1px solid #ddd; outline: none; font-size: 16px; }
        button { background: #ff6b81; color: white; border: none; border-radius: 20px; padding: 0 15px; height: 40px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .typing-indicator { font-size: 12px; color: #e84393; padding: 5px 15px; font-style: italic; }
        .hidden { display: none !important; }
        
        /* Provider toggle switch */
        .provider-switch { display: flex; align-items: center; gap: 6px; }
        .provider-switch label { font-size: 11px; color: #666; white-space: nowrap; }
        .toggle-switch { position: relative; width: 40px; height: 22px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #6c5ce7; border-radius: 22px; transition: .3s;
        }
        .toggle-slider:before {
            content: ""; position: absolute; height: 16px; width: 16px; left: 3px; bottom: 3px;
            background-color: white; border-radius: 50%; transition: .3s;
        }
        .toggle-switch input:checked + .toggle-slider { background-color: #00b894; }
        .toggle-switch input:checked + .toggle-slider:before { transform: translateX(18px); }
        
        /* Modal for settings */
        #settingsModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100;
        }
        .modal-content {
            background: white; padding: 20px; border-radius: 20px; width: 85%; max-width: 400px;
            display: flex; flex-direction: column; gap: 12px; max-height: 85vh; overflow-y: auto;
        }
        .modal-content h2 { margin: 0; font-size: 18px; text-align: center; }
        .modal-content input { width: 100%; box-sizing: border-box; }
        .modal-content label { font-size: 13px; font-weight: 600; color: #333; margin-bottom: -8px; }
        .modal-content .hint { font-size: 11px; color: #888; margin-top: -6px; }
        .modal-buttons { display: flex; gap: 10px; }
        .modal-buttons button { flex: 1; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="header">
    <img src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><circle cx='20' cy='20' r='20' fill='%23ff6b81'/><text x='20' y='26' text-anchor='middle' fill='white' font-size='18'>A</text></svg>" alt="Alya" class="avatar">
    <div class="header-info">
        <h1>Аля</h1>
        <p>в сети</p>
    </div>
    <div class="header-right">
        <div class="provider-switch">
            <label id="providerLabel">☁️ Облако (Groq)</label>
            <div class="toggle-switch">
                <input type="checkbox" id="providerToggle">
                <span class="toggle-slider"></span>
            </div>
        </div>
        <button id="openSettings" style="background:none; font-size:24px;">⚙️</button>
    </div>
</div>

<div class="chat-container" id="chat">
    <div class="message bot">Привет! Я Аля. О чём хочешь поговорить? 😊</div>
    <div class="typing-indicator hidden" id="typing">Аля печатает...</div>
</div>

<div class="input-area">
    <input type="text" id="userInput" placeholder="Сообщение...">
    <button id="sendBtn" style="border-radius:50%; width:40px; padding:0;">➤</button>
</div>

<div id="settingsModal" class="hidden">
    <div class="modal-content">
        <h2>⚙️ Подключение к боту</h2>
        
        <label>URL сервера (ngrok):</label>
        <input type="text" id="apiUrlInput" placeholder="https://xxxx.ngrok-free.app">
        <div class="hint">Вставь сюда ссылку ngrok, которую получил при запуске бота</div>
        
        <div class="modal-buttons">
            <button id="saveSettings" style="background:#2ecc71;">Сохранить</button>
            <button id="closeSettings" style="background:#e74c3c;">Закрыть</button>
        </div>
    </div>
</div>

<script src="alya_chat.js?v=8"></script>
</body>
</html>
