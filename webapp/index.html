<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Чат с Алей</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #222222);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #ff6b81);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg-color: rgba(255, 255, 255, 0.85);
            --alya-msg-bg: #f9ecee;
            --alya-msg-text: #333333;
            --user-msg-bg: linear-gradient(135deg, #ff7e5f, #feb47b);
            --user-msg-text: #ffffff;
            --app-bg: url('https://i.pinimg.com/736x/8b/44/1a/8b441a7da931f825d1979ad2a4d9ab96.jpg') center/cover no-repeat;
        }
        body { font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: var(--app-bg); }
        .header { display: flex; align-items: center; padding: 12px; background: var(--secondary-bg-color); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .avatar { width: 40px; height: 40px; border-radius: 50%; margin-right: 12px; border: 2px solid #ff6b81; }
        .header-info h1 { margin: 0; font-size: 16px; }
        .header-info p { margin: 0; font-size: 12px; color: #2ecc71; }
        .chat-container { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 80%; padding: 10px 14px; border-radius: 18px; font-size: 15px; }
        .message.bot { align-self: flex-start; background: var(--alya-msg-bg); color: var(--alya-msg-text); }
        .message.user { align-self: flex-end; background: var(--user-msg-bg); color: var(--user-msg-text); }
        .input-area { display: flex; padding: 10px; background: var(--secondary-bg-color); gap: 10px; }
        input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ddd; outline: none; }
        button { background: #ff6b81; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; }
        .typing-indicator { font-size: 12px; color: #999; padding: 5px 15px; }
        .hidden { display: none; }
    </style>
</head>
