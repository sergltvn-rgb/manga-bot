<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>&#1055;&#1088;&#1086;&#1074;&#1077;&#1088;&#1082;&#1072; &#1088;&#1086;&#1079;&#1099;&#1075;&#1088;&#1099;&#1096;&#1072;</title>
  <meta name="theme-color" content="#8b5cf6">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="shared.css?v=20260428-recovery-2">
  <script src="shared.js?v=20260428-recovery-2"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #fbfaff;
      --surface: rgba(255, 255, 255, 0.94);
      --surface-strong: #ffffff;
      --text: #1a1a2e;
      --muted: #64748b;
      --accent: #8b5cf6;
      --accent-2: #ec4899;
      --state: #8b5cf6;
      --line: rgba(139, 92, 246, 0.16);
      --shadow: 0 18px 54px rgba(88, 28, 135, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        linear-gradient(160deg, #ffffff 0%, #f5f0ff 43%, #fff0f7 100%);
      overflow-x: hidden;
    }

    body[data-state="success"] { --state: #16a34a; }
    body[data-state="missing"] { --state: #f59e0b; }
    body[data-state="error"] { --state: #ef4444; }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(139, 92, 246, 0.08) 1px, transparent 1px),
        linear-gradient(180deg, rgba(139, 92, 246, 0.06) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.48), transparent 72%);
    }

    .shell {
      min-height: 100svh;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: max(18px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      gap: 14px;
      position: relative;
    }

    .stage {
      display: grid;
      place-items: center;
      min-height: 0;
    }

    .panel {
      width: min(100%, 440px);
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 22px;
      padding: 18px 18px 22px;
      box-shadow: var(--shadow);
      text-align: center;
      backdrop-filter: blur(18px);
      animation: panel-in 520ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .eyebrow {
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      border-radius: 999px;
      background: rgba(139, 92, 246, 0.1);
      color: #6d28d9;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .mascot {
      position: relative;
      width: min(100%, 342px);
      aspect-ratio: 1 / 1;
      margin: 8px auto 10px;
      border-radius: 26px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 44%, rgba(236, 72, 153, 0.13), transparent 34%),
        radial-gradient(circle at 50% 60%, rgba(139, 92, 246, 0.13), transparent 45%),
        linear-gradient(180deg, #ffffff, #f8f4ff);
      border: 1px solid rgba(139, 92, 246, 0.1);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
      animation: mascot-float 4.8s ease-in-out 720ms infinite;
    }

    .mascot::after {
      content: "";
      position: absolute;
      inset: 13%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.15), transparent 68%);
      transform: translateY(26%);
      filter: blur(12px);
      animation: glow-pulse 3.8s ease-in-out infinite;
    }

    .mascot img {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      transform: scale(1.08) translateY(2px);
      filter: saturate(1.05) contrast(1.02);
      animation: mascot-pop 640ms cubic-bezier(0.16, 1, 0.3, 1) 120ms both;
    }

    .state-pill {
      width: fit-content;
      max-width: 100%;
      min-height: 34px;
      margin: 0 auto 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border-radius: 999px;
      color: var(--state);
      background: color-mix(in srgb, var(--state) 12%, #ffffff);
      border: 1px solid color-mix(in srgb, var(--state) 24%, transparent);
      font-size: 13px;
      font-weight: 800;
      animation: pill-in 520ms cubic-bezier(0.16, 1, 0.3, 1) 180ms both;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(24px, 8vw, 30px);
      line-height: 1.25;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 15.5px;
      line-height: 1.45;
    }

    .status {
      margin-top: 18px;
      display: grid;
      gap: 8px;
    }

    .channel {
      min-height: 50px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface-strong);
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 12px;
      font-weight: 650;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.05);
    }

    .channel span:first-child {
      overflow-wrap: anywhere;
      text-align: left;
    }

    .channel span:last-child {
      color: var(--accent-2);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .actions {
      width: min(100%, 440px);
      margin: 0 auto;
      display: grid;
      gap: 10px;
    }

    button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 12px 26px rgba(139, 92, 246, 0.28);
      transition: transform 160ms ease, filter 160ms ease, box-shadow 160ms ease;
      animation: action-in 520ms cubic-bezier(0.16, 1, 0.3, 1) 260ms both;
    }

    button.secondary {
      color: var(--text);
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--line);
      box-shadow: none;
    }

    button:active {
      transform: translateY(1px);
    }

    button:hover {
      filter: brightness(1.04);
      box-shadow: 0 16px 30px rgba(139, 92, 246, 0.32);
    }

    @media (max-height: 700px) {
      .mascot { width: min(100%, 270px); }
      .panel { padding: 14px 14px 18px; }
      h1 { font-size: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .panel,
      .mascot,
      .mascot::after,
      .mascot img,
      .state-pill,
      button {
        animation-duration: 1ms;
        animation-iteration-count: 1;
      }
    }

    @keyframes panel-in {
      from { opacity: 0; transform: translateY(18px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes mascot-pop {
      from { opacity: 0; transform: scale(1.02) translateY(16px); }
      to { opacity: 1; transform: scale(1.08) translateY(2px); }
    }

    @keyframes mascot-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @keyframes glow-pulse {
      0%, 100% { opacity: 0.72; transform: translateY(26%) scale(0.94); }
      50% { opacity: 1; transform: translateY(26%) scale(1.08); }
    }

    @keyframes pill-in {
      from { opacity: 0; transform: translateY(8px) scale(0.94); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes action-in {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="shared-recovery-mount" hidden>Повторить Сообщить админу</div>
  <main class="shell">
    <section class="stage">
      <div class="panel">
        <div class="eyebrow">Alya Giveaway</div>
        <div class="mascot" aria-hidden="true">
          <img id="mascot" src="assets/giveaway-waiting-clean.webp" alt="" decoding="async" fetchpriority="high">
        </div>
        <div id="state" class="state-pill">Проверка подписки</div>
        <h1 id="title">&#1055;&#1088;&#1086;&#1074;&#1077;&#1088;&#1103;&#1077;&#1084; &#1087;&#1086;&#1076;&#1087;&#1080;&#1089;&#1082;&#1091;...</h1>
        <p id="text">&#1069;&#1090;&#1086; &#1079;&#1072;&#1081;&#1084;&#1077;&#1090; &#1087;&#1072;&#1088;&#1091; &#1089;&#1077;&#1082;&#1091;&#1085;&#1076;.</p>
        <div id="channels" class="status hidden"></div>
      </div>
    </section>
    <section class="actions">
      <button id="retry" class="secondary hidden" type="button">&#1055;&#1088;&#1086;&#1074;&#1077;&#1088;&#1080;&#1090;&#1100; &#1089;&#1085;&#1086;&#1074;&#1072;</button>
      <button id="close" type="button">&#1047;&#1072;&#1082;&#1088;&#1099;&#1090;&#1100;</button>
    </section>
  </main>

  <script>
    const tg = window.Telegram?.WebApp || null;
    const params = new URLSearchParams(location.search);
    const startParam = tg?.initDataUnsafe?.start_param || params.get('tgWebAppStartParam') || '';
    const giveawayId = params.get('giveaway_id') || (startParam.match(/^giveaway_(\d+)$/)?.[1] || '');
    const apiBase = (params.get('api') || location.origin).replace(/\/$/, '');
    const sharedApi = window.AlyaWebApp?.createApiClient({ baseUrl: apiBase, initData: tg?.initData || '', timeoutMs: 12000 });

    const copy = {
      checkingState: '\u041f\u0440\u043e\u0432\u0435\u0440\u043a\u0430 \u043f\u043e\u0434\u043f\u0438\u0441\u043a\u0438',
      successState: '\u0412\u0441\u0435 \u0433\u043e\u0442\u043e\u0432\u043e',
      missingState: '\u041d\u0443\u0436\u043d\u0430 \u043f\u043e\u0434\u043f\u0438\u0441\u043a\u0430',
      errorState: '\u041d\u0443\u0436\u043d\u043e \u043f\u043e\u0432\u0442\u043e\u0440\u0438\u0442\u044c',
      checkingTitle: '\u041f\u0440\u043e\u0432\u0435\u0440\u044f\u0435\u043c \u043f\u043e\u0434\u043f\u0438\u0441\u043a\u0443...',
      checkingText: '\u042d\u0442\u043e \u0437\u0430\u0439\u043c\u0435\u0442 \u043f\u0430\u0440\u0443 \u0441\u0435\u043a\u0443\u043d\u0434.',
      notFoundTitle: '\u0420\u043e\u0437\u044b\u0433\u0440\u044b\u0448 \u043d\u0435 \u043d\u0430\u0439\u0434\u0435\u043d',
      notFoundText: '\u041e\u0442\u043a\u0440\u043e\u0439\u0442\u0435 \u043f\u0440\u043e\u0432\u0435\u0440\u043a\u0443 \u043f\u043e \u043a\u043d\u043e\u043f\u043a\u0435 \u0438\u0437 \u043f\u043e\u0441\u0442\u0430 \u0440\u043e\u0437\u044b\u0433\u0440\u044b\u0448\u0430.',
      telegramTitle: '\u041d\u0443\u0436\u0435\u043d Telegram Mini App',
      telegramText: '\u041e\u0442\u043a\u0440\u043e\u0439\u0442\u0435 \u043f\u0440\u043e\u0432\u0435\u0440\u043a\u0443 \u0447\u0435\u0440\u0435\u0437 \u043a\u043d\u043e\u043f\u043a\u0443 \u0432 Telegram, \u0447\u0442\u043e\u0431\u044b \u0431\u043e\u0442 \u043f\u043e\u043d\u044f\u043b, \u043a\u0442\u043e \u0443\u0447\u0430\u0441\u0442\u0432\u0443\u0435\u0442.',
      failedTitle: '\u041d\u0435 \u0443\u0434\u0430\u043b\u043e\u0441\u044c \u043f\u0440\u043e\u0432\u0435\u0440\u0438\u0442\u044c \u0440\u043e\u0437\u044b\u0433\u0440\u044b\u0448',
      failedText: '\u041f\u043e\u043f\u0440\u043e\u0431\u0443\u0439\u0442\u0435 \u043e\u0442\u043a\u0440\u044b\u0442\u044c \u043f\u0440\u043e\u0432\u0435\u0440\u043a\u0443 \u0437\u0430\u043d\u043e\u0432\u043e \u0438\u0437 \u043f\u043e\u0441\u0442\u0430.',
      endedTitle: '\u0420\u043e\u0437\u044b\u0433\u0440\u044b\u0448 \u0443\u0436\u0435 \u0437\u0430\u0432\u0435\u0440\u0448\u0435\u043d',
      endedText: '\u041a\u043d\u043e\u043f\u043a\u0430 \u0443\u0447\u0430\u0441\u0442\u0438\u044f \u0432 \u043f\u043e\u0441\u0442\u0435 \u0431\u043e\u043b\u044c\u0448\u0435 \u043d\u0435 \u043f\u0440\u0438\u043d\u0438\u043c\u0430\u0435\u0442 \u043d\u043e\u0432\u044b\u0445 \u0443\u0447\u0430\u0441\u0442\u043d\u0438\u043a\u043e\u0432.',
      joinedTitle: '\u0412\u044b \u0443\u0436\u0435 \u0443\u0447\u0430\u0441\u0442\u0432\u0443\u0435\u0442\u0435',
      joinedText: '\u0417\u0430\u043f\u0438\u0441\u044c \u043d\u0430\u0439\u0434\u0435\u043d\u0430, \u043f\u043e\u0432\u0442\u043e\u0440\u043d\u043e \u043d\u0430\u0436\u0438\u043c\u0430\u0442\u044c \u043a\u043d\u043e\u043f\u043a\u0443 \u0443\u0447\u0430\u0441\u0442\u0438\u044f \u043d\u0435 \u043d\u0443\u0436\u043d\u043e.',
      allowedTitle: '\u041f\u043e\u0434\u043f\u0438\u0441\u043a\u0430 \u043f\u043e\u0434\u0442\u0432\u0435\u0440\u0436\u0434\u0435\u043d\u0430',
      allowedText: '\u0412\u0435\u0440\u043d\u0438\u0442\u0435\u0441\u044c \u043a \u043f\u043e\u0441\u0442\u0443 \u0438 \u043d\u0430\u0436\u043c\u0438\u0442\u0435 "\u0423\u0447\u0430\u0441\u0442\u0432\u043e\u0432\u0430\u0442\u044c", \u0447\u0442\u043e\u0431\u044b \u0437\u0430\u0432\u0435\u0440\u0448\u0438\u0442\u044c \u0432\u0445\u043e\u0434 \u0432 \u0440\u043e\u0437\u044b\u0433\u0440\u044b\u0448.',
      missingTitle: '\u0412\u044b \u043d\u0435 \u043f\u043e\u0434\u043f\u0438\u0441\u0430\u043d\u044b \u043d\u0430 \u0432\u0441\u0435 \u043a\u0430\u043d\u0430\u043b\u044b',
      missingText: '\u041f\u043e\u0434\u043f\u0438\u0448\u0438\u0442\u0435\u0441\u044c \u043d\u0430 \u043a\u0430\u043d\u0430\u043b\u044b \u043d\u0438\u0436\u0435 \u0438 \u043d\u0430\u0436\u043c\u0438\u0442\u0435 "\u041f\u0440\u043e\u0432\u0435\u0440\u0438\u0442\u044c \u0441\u043d\u043e\u0432\u0430".',
      unavailableTitle: '\u041f\u0440\u043e\u0432\u0435\u0440\u043a\u0430 \u043d\u0435\u0434\u043e\u0441\u0442\u0443\u043f\u043d\u0430',
      unavailableText: '\u041f\u0440\u043e\u0432\u0435\u0440\u044c\u0442\u0435 \u0441\u043e\u0435\u0434\u0438\u043d\u0435\u043d\u0438\u0435 \u0438 \u043f\u043e\u043f\u0440\u043e\u0431\u0443\u0439\u0442\u0435 \u0435\u0449\u0435 \u0440\u0430\u0437.',
      open: '\u041e\u0442\u043a\u0440\u044b\u0442\u044c',
    };

    if (tg) {
      tg.ready();
      tg.expand();
    }

    const title = document.getElementById('title');
    const text = document.getElementById('text');
    const channels = document.getElementById('channels');
    const retry = document.getElementById('retry');
    const closeBtn = document.getElementById('close');
    const mascot = document.getElementById('mascot');
    const state = document.getElementById('state');
    const mascotImages = {
      waiting: {
        src: 'assets/giveaway-waiting-clean.webp',
      },
      success: {
        src: 'assets/giveaway-success-clean.webp',
      },
    };

    function setCopy(nextTitle, nextText, nextState = copy.checkingState, tone = 'checking') {
      title.textContent = nextTitle;
      text.textContent = nextText;
      state.textContent = nextState;
      document.body.dataset.state = tone;
    }

    function setMascot(state) {
      const image = mascotImages[state] || mascotImages.waiting;
      mascot.src = image.src;
      mascot.removeAttribute('srcset');
    }

    function openUrl(url) {
      if (tg && typeof tg.openTelegramLink === 'function' && /^https:\/\/t\.me\//i.test(url)) {
        tg.openTelegramLink(url);
      } else {
        location.href = url;
      }
    }

    function renderChannels(list) {
      channels.innerHTML = '';
      channels.classList.toggle('hidden', !list.length);
      for (const item of list) {
        const link = document.createElement('a');
        const channelLabel = document.createElement('span');
        const actionLabel = document.createElement('span');
        link.className = 'channel';
        link.href = item.url;
        channelLabel.textContent = item.title || item.channel_id;
        actionLabel.textContent = copy.open;
        link.append(channelLabel, actionLabel);
        link.addEventListener('click', (event) => {
          event.preventDefault();
          openUrl(item.url);
        });
        channels.appendChild(link);
      }
    }

    async function loadStatus() {
      retry.classList.add('hidden');
      renderChannels([]);
      setMascot('waiting');
      setCopy(copy.checkingTitle, copy.checkingText, copy.checkingState, 'checking');
      if (!giveawayId) {
        setCopy(copy.notFoundTitle, copy.notFoundText, copy.errorState, 'error');
        return;
      }
      if (!tg?.initData) {
        setCopy(copy.telegramTitle, copy.telegramText, copy.errorState, 'error');
        return;
      }
      try {
        const data = sharedApi
          ? await sharedApi.get(`/api/giveaway/status?giveaway_id=${encodeURIComponent(giveawayId)}`, { cache: 'no-store' })
          : await fetch(`${apiBase}/api/giveaway/status?giveaway_id=${encodeURIComponent(giveawayId)}`, {
              headers: { Authorization: `tma ${tg.initData}` },
              cache: 'no-store',
            }).then(async (response) => {
              const payload = await response.json().catch(() => ({}));
              if (!response.ok || !payload.ok) throw new Error(payload.error || `HTTP ${response.status}`);
              return payload;
            });
        if (!data.is_active) {
          setCopy(copy.endedTitle, copy.endedText, copy.errorState, 'error');
          return;
        }
        if (data.joined) {
          setMascot('success');
          setCopy(copy.joinedTitle, copy.joinedText, copy.successState, 'success');
          return;
        }
        if (data.is_allowed) {
          setMascot('success');
          setCopy(copy.allowedTitle, copy.allowedText, copy.successState, 'success');
          retry.classList.remove('hidden');
          return;
        }
        const required = Array.isArray(data.required_channels) ? data.required_channels : [];
        const missingIds = Array.isArray(data.missing_channels) ? data.missing_channels : [];
        const missing = required.filter((item) => missingIds.includes(item.channel_id));
        setCopy(copy.missingTitle, copy.missingText, copy.missingState, 'missing');
        renderChannels(missing);
        retry.classList.remove('hidden');
      } catch (error) {
        setCopy(copy.unavailableTitle, copy.unavailableText, copy.errorState, 'error');
        retry.classList.remove('hidden');
      }
    }

    retry.addEventListener('click', loadStatus);
    closeBtn.addEventListener('click', () => {
      if (tg && typeof tg.close === 'function') tg.close();
      else history.length > 1 ? history.back() : window.close();
    });

    loadStatus();
  </script>
</body>
</html>
