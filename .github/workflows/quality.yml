name: Quality Gate

# Лёгкий gate, запускается на КАЖДЫЙ push/PR в main.
# Гарантирует, что в main никогда не попадает код с:
#   - ошибками ruff (F811 shadowing, E722 bare except, и т. п.);
#   - shadowing top-level функций (наш кастомный AST-чек);
#   - сломанной регистрацией Telegram-хендлеров (smoke-тест).
#
# Pre-commit защищает локально; этот workflow — страховка на случай,
# если кто-то пушит через `--no-verify` или правит файлы прямо на GitHub UI.
#
# Тяжёлые regression-тесты живут в `reader-regression.yml`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint + Shadowing + Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Fake-токен только для импорта модуля `bot` — реальных API-вызовов нет.
      BOT_TOKEN: "1234567890:TEST_TOKEN_FOR_CI_ONLY"
      GROQ_API_KEY: "test-key"
      WEBAPP_URL: "https://example.com/"
      API_HOST: "https://example.com"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

      - name: No top-level function shadowing
        run: python scripts/check_no_shadowing.py

      - name: Pytest smoke
        run: pytest tests/ -q
